<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポケカ戦績</title>
<link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22ポケカ戦績%22%2C%22short_name%22%3A%22ポケカ戦績%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22#f5f6fa%22%2C%22theme_color%22%3A%22#e8492f%22%7D">
<link rel="apple-touch-icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxODAiIGhlaWdodD0iMTgwIiB2aWV3Qm94PSIwIDAgMTgwIDE4MCI+CjxyZWN0IHdpZHRoPSIxODAiIGhlaWdodD0iMTgwIiByeD0iMzYiIGZpbGw9IiNlODQ5MmYiLz4KPHRleHQgeD0iOTAiIHk9IjExOCIgZm9udC1zaXplPSIxMDQiIHRleHQtYW5jaG9yPSJtaWRkbGUiPvCfg488L3RleHQ+Cjwvc3ZnPg==">
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxODAiIGhlaWdodD0iMTgwIiB2aWV3Qm94PSIwIDAgMTgwIDE4MCI+CjxyZWN0IHdpZHRoPSIxODAiIGhlaWdodD0iMTgwIiByeD0iMzYiIGZpbGw9IiNlODQ5MmYiLz4KPHRleHQgeD0iOTAiIHk9IjExOCIgZm9udC1zaXplPSIxMDQiIHRleHQtYW5jaG9yPSJtaWRkbGUiPvCfg488L3RleHQ+Cjwvc3ZnPg==">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ポケカ戦績">
<meta name="theme-color" content="#e8492f">
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1d2030;--sub:#6b7186;--bd:#dfe2ec;--pri:#e8492f;--win:#2e9e5b;--lose:#d64545;--draw:#8a8fa3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171f;--card:#1f222d;--tx:#eceef5;--sub:#9aa0b5;--bd:#333848}}
:root[data-theme="dark"]{--bg:#15171f;--card:#1f222d;--tx:#eceef5;--sub:#9aa0b5;--bd:#333848}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:520px;margin:0 auto;padding:0 14px 40px}
.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:8px 0;z-index:2}
.dtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.dtabs button{flex:none;padding:9px 14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:20px;font-size:15px;white-space:nowrap}
.dtabs button.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.dtabs button.add{border-style:dashed;color:var(--pri)}
.sub-tabs{display:flex;gap:6px;margin-top:8px}
.sub-tabs button{flex:1;padding:9px;border:0;border-bottom:3px solid var(--bd);background:none;color:var(--sub);font-size:15px}
.sub-tabs button.on{border-color:var(--pri);color:var(--tx);font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:17px;margin:2px 0 4px}
label{display:block;font-size:13px;color:var(--sub);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:16px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:14px 0;border:2px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;font-size:17px;font-weight:700}
.seg button.on{color:#fff}
.seg.res button.on[data-v="勝"]{background:var(--win);border-color:var(--win)}
.seg.res button.on[data-v="負"]{background:var(--lose);border-color:var(--lose)}
.seg.res button.on[data-v="分"]{background:var(--draw);border-color:var(--draw)}
.seg.turn button.on{background:var(--pri);border-color:var(--pri)}
.save{width:100%;margin-top:16px;padding:15px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:17px;font-weight:700}
.big{display:flex;justify-content:space-around;text-align:center}
.big b{display:block;font-size:26px}
.big span{font-size:12px;color:var(--sub)}
.row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--bd)}
.row:first-child{border-top:0}
.bar{grid-column:1/3;height:6px;border-radius:3px;background:var(--bd);overflow:hidden}
.bar i{display:block;height:100%;background:var(--win)}
.sub{color:var(--sub);font-size:13px}
.h{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd)}
.h:first-child{border-top:0}
.badge{width:34px;height:34px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.h .m{flex:1;min-width:0}
.h .m div{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.del{border:0;background:none;color:var(--sub);font-size:20px;padding:6px}
.ghost{padding:10px 12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px;margin:0 6px 6px 0}
.danger{color:var(--lose)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#222;color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:.25s;pointer-events:none}
.toast.show{opacity:.95}
.hide{display:none}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px;padding:9px 0;border-top:1px solid var(--bd)}
#recmodal .box{max-height:88vh;overflow-y:auto}
.ghost.on{background:var(--pri);border-color:var(--pri);color:#fff}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumbs .t{position:relative}
.thumbs img{width:88px;height:88px;object-fit:cover;border-radius:8px;border:1px solid var(--bd)}
.thumbs .x{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:var(--lose);color:#fff;font-size:13px;padding:0}
.imgs{display:flex;gap:8px;overflow-x:auto;margin-top:8px}
.imgs img{height:170px;width:auto;border-radius:8px;border:1px solid var(--bd);flex:none}
.pre{white-space:pre-wrap;font-size:14px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px;margin-top:8px}
details{border-top:1px solid var(--bd);padding:10px 0}
summary{cursor:pointer;font-size:15px}
.dif{margin:8px 0;font-size:14px}.plus{color:var(--win)}.minus{color:var(--lose)}
.edt{border:0;background:none;color:var(--pri);font-size:14px;padding:6px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;padding:20px;z-index:10}
.modal.hide{display:none}
.modal .box{background:var(--card);border-radius:14px;padding:18px;width:100%;max-width:400px}
.modal .btns{display:flex;gap:8px;margin-top:14px}
.modal .btns button{flex:1;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:16px}
.modal .btns button#mok{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
</style>
</head>
<body>
<main>
<div class="top">
 <div class="dtabs" id="dtabs"></div>
 <div class="sub-tabs" id="subtabs"><button data-s="in">入力</button><button data-s="st">集計</button><button data-s="hi">履歴</button><button data-s="dk">デッキ</button></div>
</div>

<section id="in">
 <div class="card">
  <h2 id="ttl"></h2>
  <label>相手のデッキ</label><input id="opp" list="dl" placeholder="例:ミュウツーex" autocomplete="off">
  <datalist id="dl"></datalist>
  <label>先攻/後攻</label>
  <div class="seg turn" id="turn"><button data-v="先攻">先攻</button><button data-v="後攻">後攻</button></div>
  <label>結果</label>
  <div class="seg res" id="res"><button data-v="勝">勝</button><button data-v="負">負</button><button data-v="分">分</button></div>
  <label>イベント</label><select id="evsel"></select>
  <label>場面</label>
  <select id="scene"><option>フリー</option><option>PTCGL</option><option>オンライン</option></select>
  <div id="ratebox" class="hide"><label>対戦後のレート(任意・数字のみ)</label><input id="rate" inputmode="numeric" placeholder="例:1500" autocomplete="off"></div>
  <label>メモ(任意)</label><textarea id="memo" rows="2" placeholder="負け筋・気づきなど"></textarea>
  <button class="save" id="save">記録する</button>
  <button class="ghost hide" id="cancel" style="margin:8px 0 0;width:100%">編集をやめる</button>
 </div>
</section>

<section id="st">
 <div class="card"><div class="big" id="sum"></div></div>
 <div class="card">
  <label style="margin-top:0">集計の切り口</label><select id="grp"></select>
  <div id="tbl" style="margin-top:8px"></div>
 </div>
</section>

<section id="hi">
 <div class="card" id="list"></div>
 <div class="card"><button class="ghost danger" id="deldeck">このデッキのタブを削除</button></div>
</section>

<section id="dk">
 <div class="card" id="dkview"></div>
 <div class="card hide" id="dkedit">
  <h2>デッキリストを更新</h2>
  <label>変更メモ(任意)</label><input id="dknote" placeholder="例:ボスの指令を1枚追加" autocomplete="off">
  <div id="dkimgbox"><label id="dklbl">デッキ画像</label>
  <input type="file" id="dkfile" accept="image/*" multiple>
  <div id="dkthumbs" class="thumbs"></div></div>
  <label>カードリスト(「4 リザードex」のように1行1枚種)</label>
  <textarea id="dktext" rows="10"></textarea>
  <button class="save" id="dksave">新しいバージョンとして保存</button>
  <button class="ghost" id="dkcancel" style="margin:8px 0 0;width:100%">閉じる</button>
 </div>
 <div class="card" id="dkhist"></div>
</section>
<section id="evs"></section>
<section id="sh"></section>
<section id="bk">
 <div class="card">
  <div class="sub" style="margin-bottom:8px">バックアップ(機種変更やデータ消去に備えて)</div>
  <button class="ghost" id="exp">データをコピー</button><button class="ghost" id="imp">貼り付けて復元</button>
 </div>
</section>
</main>
<div class="toast" id="toast"></div>
<div class="modal hide" id="evmodal"><div class="box"><h2 id="evttl">イベントを作成</h2>
<label>日付</label><input type="date" id="evdate">
<label>種別</label><select id="evscene"></select>
<label>イベント名</label><input id="evname" placeholder="例:○○カードショップ ジムバトル" autocomplete="off">
<div class="btns"><button id="evcancel">キャンセル</button><button id="evok">保存</button></div></div></div>
<div class="modal hide" id="deckmenu"><div class="box"><h2>過去のデッキ</h2><div id="dmlist" style="max-height:55vh;overflow-y:auto;margin-top:8px"></div><div class="btns"><button id="dmclose">閉じる</button></div></div></div>
<div class="modal hide" id="recmodal"><div class="box"><div id="recbody"></div><div class="btns"><button id="rcedit">編集</button><button id="rcdel" style="color:var(--lose)">削除</button><button id="rcclose">閉じる</button></div></div></div>
<div class="modal hide" id="imgmenu"><div class="box"><div class="btns" style="flex-direction:column;margin-top:0"><button id="imzoom">画像の拡大</button><button id="imrep">画像の更新</button><button id="imcancel">キャンセル</button></div></div></div>
<input type="file" id="imfile" accept="image/*" class="hide">
<input type="file" id="addfile" accept="image/*" multiple class="hide">
<div class="modal hide" id="viewer"><img id="vimg" style="max-width:100%;max-height:100%;border-radius:8px"></div>
<div class="modal hide" id="modal"><div class="box"><div id="mmsg" style="white-space:pre-wrap"></div><input id="min" class="hide" style="margin-top:10px"><div class="btns"><button id="mcancel">キャンセル</button><button id="mok">OK</button></div></div></div>

<script>
const $=id=>document.getElementById(id);
const KEY="pokeRecords_v1";
let shRange=null,shScene="",act={},noevAll={},noevOpen={},menuIdx=0,grpAll=false,histAll=false,evAll=false,histMode="ev",recs=[],decks=[],lists={},events=[],curEv="",evEditId=null,editId=null,dkOpen=false,editImgs=[],last={},sel={turn:"先攻",res:"勝"},cur="",sub="in";
try{
 recs=JSON.parse(localStorage.getItem(KEY)||"[]");
 decks=JSON.parse(localStorage.getItem(KEY+"_decks")||"[]");
 last=JSON.parse(localStorage.getItem(KEY+"_last")||"{}");
 lists=JSON.parse(localStorage.getItem(KEY+"_lists")||"{}");
 events=JSON.parse(localStorage.getItem(KEY+"_events")||"[]");
 act=JSON.parse(localStorage.getItem(KEY+"_act")||"{}");
}catch(e){}
if(!lists||typeof lists!=="object"||Array.isArray(lists))lists={};
function normLists(){Object.keys(lists).forEach(d=>{const L=lists[d];if(!L||typeof L!=="object"){delete lists[d];return}
 if(!Array.isArray(L.versions)){lists[d]={versions:(L.code||L.text)?[{id:1,date:"",note:"",code:L.code||"",text:L.text||"",imgs:[]}]:[]}}})}
normLists();
if(!act||typeof act!=="object"||Array.isArray(act))act={};
if(!Array.isArray(events))events=[];
if(!Array.isArray(recs))recs=[];
recs.forEach(r=>{if(r.scene==="大会")r.scene="大型大会"});events.forEach(e=>{if(e.scene==="大会")e.scene="大型大会"});if(!Array.isArray(decks))decks=[];
const syncDecks=()=>{recs.forEach(r=>{if(!decks.includes(r.my))decks.push(r.my)})};
syncDecks();
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(recs));localStorage.setItem(KEY+"_decks",JSON.stringify(decks));localStorage.setItem(KEY+"_last",JSON.stringify(last));localStorage.setItem(KEY+"_lists",JSON.stringify(lists));localStorage.setItem(KEY+"_events",JSON.stringify(events));localStorage.setItem(KEY+"_act",JSON.stringify(act));return true}catch(e){toast("保存に失敗しました(容量不足の可能性)");return false}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function dlg(msg,o={}){return new Promise(res=>{
 $("mmsg").textContent=msg;const i=$("min");i.classList.toggle("hide",!o.input);i.value=o.value||"";
 $("mok").textContent=o.ok||"OK";$("modal").classList.remove("hide");if(o.input)i.focus();
 const done=v=>{$("modal").classList.add("hide");res(v)};
 $("mok").onclick=()=>done(o.input?i.value:true);$("mcancel").onclick=()=>done(o.input?null:false)})}
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1600)}

const touch=d=>{act[d]=Date.now()};
function selectDeck(d){cancelEdit();dkOpen=false;grpAll=false;histAll=false;noevAll={};noevOpen={};cur=d;sub=cur?"in":"st";render()}
function recentDecks(){const last=new Map();recs.forEach(r=>last.set(r.my,Math.max(last.get(r.my)||0,Number(r.id)||0)));
 return decks.map((d,i)=>({d,i,k:Math.max(Number(act[d])||0,last.get(d)||0)})).sort((a,b)=>a.k===b.k?b.i-a.i:b.k-a.k).map(x=>x.d)}
function renderTabs(){
 const rd=recentDecks(),top=rd.slice(0,3),older=rd.slice(3),vis=(cur&&!top.includes(cur))?[...top,cur]:top;
 $("dtabs").innerHTML=`<button data-d="" class="${cur===""?"on":""}">全体</button>`+vis.map(d=>`<button data-d="${esc(d)}" class="${cur===d?"on":""}">${esc(d)}</button>`).join("")+(older.length?`<button id="dmore">…</button>`:"")+`<button class="add" id="add">＋ デッキ</button>`;
 $("dtabs").querySelectorAll("button[data-d]").forEach(b=>b.onclick=()=>selectDeck(b.dataset.d));
 if($("dmore"))$("dmore").onclick=()=>{
  $("dmlist").innerHTML=older.map(d=>`<button class="ghost" data-d="${esc(d)}" style="width:100%;margin:0 0 8px;text-align:left">${esc(d)}${d===cur?"(選択中)":""}</button>`).join("");
  $("dmlist").querySelectorAll("button").forEach(b=>b.onclick=()=>{$("deckmenu").classList.add("hide");selectDeck(b.dataset.d)});
  $("deckmenu").classList.remove("hide")};
 $("add").onclick=async()=>{const n=((await dlg("デッキ名を入力してください",{input:true,ok:"追加"}))||"").trim();if(!n)return;if(!decks.includes(n))decks.push(n);touch(n);persist();cur=n;sub="in";render()};
}
$("dmclose").onclick=()=>$("deckmenu").classList.add("hide");
document.querySelectorAll("#subtabs button").forEach(b=>b.onclick=()=>{sub=b.dataset.s;render()});
["turn","res"].forEach(k=>$(k).querySelectorAll("button").forEach(b=>b.onclick=()=>{sel[k]=b.dataset.v;paintSeg()}));
function paintSeg(){["turn","res"].forEach(k=>$(k).querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.v===sel[k])))}

function nowStr(){const p=n=>String(n).padStart(2,"0"),d=new Date();return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
const RCOL={"勝":"var(--win)","負":"var(--lose)","分":"var(--draw)"};
const kv=(k,v)=>`<div class="kv"><span class="sub">${k}</span><div style="white-space:pre-wrap;word-break:break-word">${esc(v)}</div></div>`;
let detId=null;
function updateRate(){$("ratebox").classList.toggle("hide",$("scene").value!=="PTCGL")}
$("scene").onchange=updateRate;
$("rate").oninput=()=>{$("rate").value=$("rate").value.replace(/[０-９]/g,c=>String.fromCharCode(c.charCodeAt(0)-65248)).replace(/\D/g,"")};
function startEdit(id){const r=recs.find(x=>String(x.id)===String(id));if(!r)return;
 cancelEdit();dkOpen=false;cur=r.my;editId=r.id;$("opp").value=r.opp;$("memo").value=r.memo||"";$("rate").value=r.rate||"";sel.turn=r.turn;sel.res=r.res;
 curEv=events.some(e=>String(e.id)===String(r.eventId))?String(r.eventId):"";setScene(r.scene);paintSeg();sub="in";render()}
function openDetail(id){const r=recs.find(x=>String(x.id)===String(id));if(!r)return;detId=r.id;const e=evOf(r);
 $("recbody").innerHTML=`<div style="display:flex;gap:10px;align-items:center;margin-bottom:6px"><div class="badge" style="background:${RCOL[r.res]}">${r.res}</div><div><b>${esc(r.my)}</b><br><span class="sub">vs ${esc(r.opp)}</span></div></div>`
  +kv("日時",r.date)+kv("先攻/後攻",r.turn)+kv("場面",r.scene)+(e?kv("イベント",evShort(e)+"("+e.scene+")"):"")+(r.rate?kv("対戦後のレート",r.rate):"")+kv("メモ",r.memo||"—");
 $("recmodal").classList.remove("hide")}
$("rcclose").onclick=()=>$("recmodal").classList.add("hide");
$("rcedit").onclick=()=>{$("recmodal").classList.add("hide");startEdit(detId)};
$("rcdel").onclick=async()=>{$("recmodal").classList.add("hide");const r=recs.find(x=>x.id===detId);if(!r)return;
 if(await dlg("この記録を削除しますか?",{ok:"削除"})){recs=recs.filter(x=>x.id!==detId);touch(r.my);persist();render()}};
function cancelEdit(){editId=null;$("opp").value="";$("memo").value="";$("rate").value=""}
function setScene(v){if(![...$("scene").options].some(o=>o.value===v)){const o=document.createElement("option");o.textContent=v;$("scene").appendChild(o)}$("scene").value=v}
$("save").onclick=()=>{
 const opp=$("opp").value.trim();
 if(!opp){toast("相手のデッキを入力してください");return}
 const f={opp,turn:sel.turn,res:sel.res,scene:$("scene").value,eventId:curEv,rate:$("scene").value==="PTCGL"?$("rate").value.replace(/\D/g,""):"",memo:$("memo").value.trim()};
 last={scene:f.scene,turn:f.turn,ev:curEv};
 if(editId){const r=recs.find(x=>x.id===editId);if(r)Object.assign(r,f);cancelEdit();touch(cur);persist();toast("更新しました");sub="hi";render();return}
 recs.push(Object.assign({id:Date.now(),date:nowStr(),my:cur},f));
 touch(cur);persist();$("opp").value="";$("memo").value="";$("rate").value="";toast("記録しました("+f.res+")");render()};
$("cancel").onclick=()=>{cancelEdit();sub="hi";render()};
const vers=()=>(lists[cur]&&lists[cur].versions)||[];
function parseList(t){const m={};(t||"").split("\n").forEach(l=>{const x=l.trim().match(/^(\d+)\s*[x×]?\s*(.+)$/i);if(x){const k=x[2].trim();m[k]=(m[k]||0)+Number(x[1])}});return m}

 const m={};rs.forEach(r=>{(m[r.opp]=m[r.opp]||0)+0;m[r.opp]=(m[r.opp]||0)+1});
 const rows=Object.entries(m).sort((a,b)=>b[1]-a[1]),total=rs.length;
 let body;
 if(!total)body='<div class="sub" style="margin-top:8px">この期間の記録がありません</div>';

  const major=rows.filter(([,n])=>n/total>=0.05),minor=rows.filter(([,n])=>n/total<0.05);

  if(minor.length)items.push({k:"その他("+minor.length+"種)",n:minor.reduce((t,[,n])=>t+n,0),c:"#8a8fa3"});
  let a0=-Math.PI/2;const C=100,R=90;
  const paths=items.map(it=>{const f=it.n/total;if(f>=0.9999)return `<circle cx="100" cy="100" r="90" fill="${it.c}"/>`;
   const a1=a0+f*2*Math.PI,x0=C+R*Math.cos(a0),y0=C+R*Math.sin(a0),x1=C+R*Math.cos(a1),y1=C+R*Math.sin(a1);
   const d=`M${C} ${C}L${x0.toFixed(2)} ${y0.toFixed(2)}A${R} ${R} 0 ${f>0.5?1:0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z`;a0=a1;
   return `<path d="${d}" fill="${it.c}" stroke="var(--card)" stroke-width="1.5"/>`}).join("");
  const pc=n=>Math.round(n/total*100)+"%";

  <div style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="date" id="shfrom" value="${from||""}" style="flex:1"><span class="sub">〜</span><input type="date" id="shto" value="${to||""}" style="flex:1"></div>

 if(!rs.length)body='<div class="sub">まだ記録がありません</div>';

  mb=(left>0||(histAll&&v.length>LIM))?btn(histAll?"閉じる(直近のみ表示)":"もっと見る(残り"+left+"件)"):""}
 else{
  const noev=histMode==="noev",g={},sub=rs.filter(r=>noev?!evOf(r):evOf(r));
  sub.forEach(r=>{const k=noev?r.scene:String(evOf(r).id);(g[k]=g[k]||[]).push(r)});
  const evById=k=>events.find(e=>String(e.id)===k),ORD=["フリー","PTCGL","オンライン"],oi=x=>ORD.indexOf(x)<0?9:ORD.indexOf(x);
  const keys=Object.keys(g).sort((x,y)=>noev?oi(x)-oi(y):(evById(y).date.localeCompare(evById(x).date)||evById(y).id-evById(x).id));
  const st=a=>{const w=a.filter(r=>r.res==="勝").length,l=a.filter(r=>r.res==="負").length;return `${a.length}戦 ${w}-${l}-${a.length-w-l} ・勝率${Math.round(w/a.length*100)}%`};
  if(!keys.length)body=`<div class="sub">${noev?"イベントなしの記録はありません":"イベントの記録はありません"}</div>`;
  else if(noev)body=keys.map(k=>{const v=[...g[k]].reverse(),vis=noevAll[k]?v:v.slice(0,5);
   return `<details ${noevOpen[k]||k===keys[0]?"open":""}><summary><b>${esc(k)}</b><br><span class="sub">${st(g[k])}</span></summary>${vis.map(r=>row(r,false)).join("")}${v.length>5?`<button class="ghost scmore" data-k="${esc(k)}" style="width:100%;margin:8px 0 0">${noevAll[k]?"閉じる(直近5件のみ表示)":"もっと見る(残り"+(v.length-5)+"件)"}</button>`:""}</details>`}).join("");
  else{const vk=histAll?keys:keys.slice(0,5);
   body=vk.map((k,i)=>{const e=evById(k);
    return `<details ${i===0?"open":""}><summary><b>${esc(evShort(e))}</b><br><span class="sub">${esc(e.scene)} ・${st(g[k])}</span></summary>${[...g[k]].reverse().map(r=>row(r,false)).join("")}</details>`}).join("");
   mb=keys.length>5?btn(histAll?"閉じる(直近5件のみ表示)":"もっと見る(残り"+(keys.length-5)+"件のイベント)"):""}
 }
 $("list").innerHTML=tog+body+mb;
 if($("hmore"))$("hmore").onclick=()=>{histAll=!histAll;hist()};
 $("list").querySelectorAll(".scmore").forEach(b=>b.onclick=()=>{const k=b.dataset.k;noevAll[k]=!noevAll[k];noevOpen[k]=true;hist()});
 $("list").querySelectorAll(".hmode").forEach(b=>b.onclick=()=>{histMode=b.dataset.m;hist()});
 $("list").querySelectorAll(".del").forEach(b=>b.onclick=async()=>{if(await dlg("この記録を削除しますか?",{ok:"削除"})){recs=recs.filter(r=>r.id!=b.dataset.id);touch(cur);persist();render()}});
 $("list").querySelectorAll(".edt").forEach(b=>{if(!b.classList.contains("mm"))b.onclick=()=>startEdit(b.dataset.id)});
 $("list").querySelectorAll(".mm").forEach(b=>b.onclick=()=>{const el=document.getElementById("mm-"+b.dataset.id);if(el)el.classList.toggle("hide")});
 $("list").querySelectorAll(".h").forEach(h=>h.onclick=e=>{if(e.target.closest("button"))return;openDetail(h.dataset.id)});
}
$("deldeck").onclick=async()=>{
 const n=recs.filter(r=>r.my===cur).length;
 if(await dlg(`「${cur}」のタブと、その記録${n}件を削除します。よろしいですか?`,{ok:"削除"})){recs=recs.filter(r=>r.my!==cur);decks=decks.filter(d=>d!==cur);delete lists[cur];delete act[cur];persist();cur="";sub="st";render()}};

$("exp").onclick=async()=>{const s=JSON.stringify({recs,decks,lists,events,act});
 try{await navigator.clipboard.writeText(s);toast("コピーしました。メモ等に保存してください")}catch(e){dlg("以下を全選択してコピーし、メモ等に保存してください",{input:true,value:s,ok:"閉じる"})}};
$("imp").onclick=async()=>{const s=await dlg("コピーしたデータを貼り付けてください(現在のデータは置き換わります)",{input:true,ok:"復元"});
 if(!s)return;try{const o=JSON.parse(s);const a=Array.isArray(o)?o:o.recs;if(!Array.isArray(a))throw 0;
  recs=a;decks=Array.isArray(o.decks)?o.decks:[];lists=(o.lists&&typeof o.lists==="object")?o.lists:{};events=Array.isArray(o.events)?o.events:[];act=(o.act&&typeof o.act==="object"&&!Array.isArray(o.act))?o.act:{};normLists();syncDecks();persist();render();toast("復元しました")}catch(e){toast("データの形式が正しくありません")}};

if(last.turn)sel.turn=last.turn;
$("evscene").innerHTML=["ジムバトル","シティリーグ","大型大会","その他"].map(x=>`<option>${x}</option>`).join("");
curEv=events.some(e=>String(e.id)===String(last.ev))?String(last.ev):"";
baseScene(last.scene);
paintSeg();
cur=decks[0]||"";sub=cur?"in":"st";
render();
</script>
</body>
</html>
